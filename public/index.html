<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Screen — 100% GitHub Pages</title>
  <!-- Biblioteca gratuita que elimina a necessidade de backend Node.js -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    
    header { background: #1e293b; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #334155; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.9rem; }
    
    main { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; padding: 1rem; }
    .card { background: #1e293b; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; aspect-ratio: 16/9; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
    
    footer { background: #1e293b; padding: 1rem; display: flex; justify-content: center; gap: 0.8rem; }
    button { background: #3b82f6; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #2563eb; }
    button.danger { background: #ef4444; }
  </style>
</head>
<body>

  <header>
    <div class="badge">Seu ID: <b id="myId">Gerando...</b></div>
    <button id="btnCopy" style="display: none;">Copiar Link da Reunião</button>
  </header>

  <main id="videoGrid">
    <div class="card">
      <video id="localVideo" autoplay playsinline muted></video>
      <span class="label">Sua Tela / Câmera</span>
    </div>
  </main>

  <footer>
    <button id="btnScreen">Compartilhar Tela</button>
    <button id="btnCam">Ligar Câmera</button>
  </footer>

  <script>
    const videoGrid = document.getElementById('videoGrid');
    const localVideo = document.getElementById('localVideo');
    const myIdLabel = document.getElementById('myId');
    const btnCopy = document.getElementById('btnCopy');
    let localStream = null;

    // Conecta na nuvem gratuita do PeerJS (dispensa servidor Node próprio)
    const peer = new Peer();

    peer.on('open', (id) => {
      myIdLabel.textContent = id;
      btnCopy.style.display = 'inline-block';

      // Se entrou por um link compartilhado, liga automaticamente para a outra pessoa
      const urlParams = new URLSearchParams(window.location.search);
      const targetRoom = urlParams.get('room');
      if (targetRoom) {
        connectToUser(targetRoom);
      }
    });

    // Copiar link da sala
    btnCopy.onclick = () => {
      const shareUrl = `${window.location.origin}${window.location.pathname}?room=${peer.id}`;
      navigator.clipboard.writeText(shareUrl);
      alert('Link copiado! Envie para o seu amigo.');
    };

    // Compartilhar tela
    document.getElementById('btnScreen').onclick = async () => {
      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
      } catch (e) {
        alert('Compartilhamento cancelado ou negado.');
      }
    };

    // Ligar Câmera
    document.getElementById('btnCam').onclick = async () => {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
      } catch (e) {
        alert('Acesso à câmera negado.');
      }
    };

    // Atender ligação recebida
    peer.on('call', (call) => {
      call.answer(localStream);
      setupRemoteVideo(call);
    });

    // Chamar outra pessoa
    function connectToUser(remoteId) {
      // Se não tiver câmera/tela ligada, cria uma transmissão vazia para poder receber o vídeo
      const streamToSend = localStream || new MediaStream();
      const call = peer.call(remoteId, streamToSend);
      setupRemoteVideo(call);
    }

    function setupRemoteVideo(call) {
      call.on('stream', (remoteStream) => {
        if (document.getElementById(`remote-${call.peer}`)) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `remote-${call.peer}`;

        const video = document.createElement('video');
        video.srcObject = remoteStream;
        video.autoplay = true;
        video.playsInline = true;

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = 'Outro Participante';

        card.appendChild(video);
        card.appendChild(label);
        videoGrid.appendChild(card);
      });
    }
  </script>
</body>
</html>
